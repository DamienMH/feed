<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#16130e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink: #edf0ec; --ink-doux: #94a2a4; --ink-faible: #5d6b6e;
    --rule: rgba(255,255,255,.11);
    --surface: rgba(255,255,255,.045); --surface-haute: rgba(255,255,255,.085);
    --accent: #e0a458; --ground: #16130e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #050708; color: var(--ink);
    font-family: "Karla", system-ui, -apple-system, sans-serif;
    font-size: 16px; line-height: 1.5;
    display: flex; justify-content: center; min-height: 100vh;
  }
  .tel {
    position: relative; width: 100%; max-width: 430px;
    height: 100vh; height: 100dvh; background: var(--ground);
    overflow: hidden; display: flex; flex-direction: column;
  }

  /* viewport-fit=cover et la barre d etat translucide d iOS font passer la page
     SOUS l heure et les indicateurs reseau. C est ce qu on veut pour les images,
     qui gagnent tout l ecran, mais il faut alors reserver la place a la main :
     sans ces marges, l en-tete se retrouve cache derriere l horloge. */
  .haut {
    position: relative; z-index: 20;
    padding: calc(18px + env(safe-area-inset-top)) 16px 10px;
    background: linear-gradient(180deg, var(--ground) 60%, transparent);
    display: flex; flex-direction: column; gap: 9px;
  }
  .segments { display: flex; align-items: center; gap: 10px; }
  .groupe-seg { display: flex; gap: 3px; flex: var(--poids, 1); }
  .seg { flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255,255,255,.14); transition: background .3s; }
  .seg.faite { background: var(--c, var(--accent)); }
  .seg.active { background: rgba(255,255,255,.55); }
  .haut-ligne { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .module-nom {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    letter-spacing: .13em; text-transform: uppercase; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 7px; min-width: 0;
  }
  .point-mod { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .outils { display: flex; align-items: center; gap: 6px; flex: none; }
  .outils button, .compteur {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    color: var(--ink-faible); background: none; border: 1px solid var(--rule);
    border-radius: 999px; padding: 4px 10px; cursor: pointer;
  }
  .compteur { border-color: transparent; font-variant-numeric: tabular-nums; }

  /* ---- fond partage ----
     L illustration ne vit plus dans la carte mais derriere le flux. Deux volets
     d un meme chapitre partagent la meme image : elle doit rester immobile
     pendant que le texte defile, au lieu de sortir par le haut et de revenir
     identique par le bas. Le fondu ne se declenche donc que quand l image
     change reellement. */
  .fond { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: var(--ground); }
  .fond img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .5s ease;
  }
  .fond img.visible { opacity: 1; }
  .fond::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.12) 26%,
                                var(--ground) 72%, var(--ground) 100%);
    opacity: .95; transition: opacity .5s ease, background .5s ease;
  }
  /* Un chapitre se lit du haut au bas de l ecran : son image passe en texture. */
  .fond.lecture::after { background: var(--ground); opacity: .91; }

  .flux { position: relative; z-index: 1; flex: 1; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .flux::-webkit-scrollbar { display: none; }
  .carte {
    scroll-snap-align: start; scroll-snap-stop: always; height: 100%;
    /* La reserve du bas doit couvrir la barre d actions ET l indicateur
       d accueil de l iPhone, sinon la derniere ligne passe dessous. */
    padding: 2px 22px calc(96px + env(safe-area-inset-bottom)); display: flex; flex-direction: column;
    justify-content: center; position: relative;
    /* Pas d overscroll-behavior: contain ici. Une carte qui deborde devient
       son propre conteneur de defilement, et "contain" empeche alors le geste
       de remonter jusqu au flux : on reste bloque dedans, dans les deux sens. */
    overflow-y: auto; scrollbar-width: none;
  }
  .carte::-webkit-scrollbar { display: none; }

  .bandeau {
    display: flex; align-items: center; gap: 11px; margin: 0 0 24px;
    padding-bottom: 13px; border-bottom: 1px solid var(--rule);
    animation: entre .45s ease both;
  }
  .bandeau-filet { width: 34px; height: 3px; border-radius: 2px; background: var(--c); flex: none; }
  .bandeau-nom { font-family: "Instrument Serif", Georgia, serif; font-size: 20px; line-height: 1; }
  .bandeau-type {
    margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 9.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faible);
  }
  @keyframes entre { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .kicker {
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-faible); margin-bottom: 12px;
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  }
  .num-chapitre {
    font-family: "Instrument Serif", Georgia, serif; font-size: 30px; line-height: .8;
    color: var(--accent); letter-spacing: 0; text-transform: none;
  }
  .suite-de {
    font-size: 13px; color: var(--ink-doux); border-left: 2px solid var(--rule);
    padding-left: 10px; margin: 0 0 15px;
  }
  .volets { display: flex; gap: 5px; margin-bottom: 17px; }
  .volet-pt { width: 22px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.16); }
  .volet-pt.on { background: var(--accent); }

  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.13; margin: 0 0 17px; text-wrap: balance; }
  h2 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.18; margin: 0 0 15px; text-wrap: balance; }
  p { margin: 0 0 14px; color: #d7ddd9; }
  p:last-child { margin-bottom: 0; }
  .accroche {
    font-family: "Instrument Serif", Georgia, serif; font-style: italic;
    font-size: 21px; line-height: 1.3; color: var(--accent);
    margin: 2px 0 17px; padding-left: 14px; border-left: 2px solid currentColor;
  }
  .meta-bas { margin-top: 20px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--ink-faible); line-height: 1.6; }
  .meta-bas a { color: var(--ink-doux); }

  .visuel { position: absolute; inset: 0; z-index: 0; }
  .visuel img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Une oeuvre dont l image n est pas la : on montre le cadre et le cartel,
     comme un mur de musee ou la toile serait decrochee. Pas de faux visuel. */
  .visuel.cadre::after { display: none; }
  .plaque {
    position: absolute; inset: 0; background: #100f0e; overflow: hidden;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 13%;
  }
  .plaque::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(92% 56% at 50% 24%, var(--c), transparent 72%);
    opacity: .28;
  }
  .plaque::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 34%, var(--ground) 76%);
  }
  .plaque-cadre {
    position: relative; z-index: 1; height: 40%; aspect-ratio: 4 / 5; max-width: 62%;
    border: 1px solid rgba(255,255,255,.2);
    display: grid; place-items: center; padding: 20px; text-align: center;
    background: rgba(255,255,255,.025);
  }
  .plaque-cadre::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(255,255,255,.08); }
  .cartel {
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(255,255,255,.5); line-height: 1.9;
  }
  .cartel i { display: block; width: 26px; height: 1px; background: rgba(255,255,255,.22); margin: 9px auto; }

  .visuel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--ground) 0%, rgba(0,0,0,.12) 34%, var(--ground) 96%);
    opacity: .88;
  }
  /* ---- mode contemplation ----
     Sur une oeuvre, tout ce qui est ecrit passe devant le tableau. Un bouton
     efface l interface et montre l image entiere, sans recadrage : "cover"
     remplit l ecran mais ampute l oeuvre, "contain" la donne telle qu elle est. */
  .loupe {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 18px; z-index: 6;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,255,255,.22); background: rgba(10,10,12,.45);
    color: rgba(255,255,255,.8); font-size: 14px; line-height: 1;
    display: grid; place-items: center; backdrop-filter: blur(6px);
  }
  .tel.plein .haut, .tel.plein .bas { opacity: 0; pointer-events: none; }
  .haut, .bas { transition: opacity .3s ease; }

  /* La contemplation ne se joue pas dans la carte : le flux commence sous
     l en-tete, donc une image stylee a l interieur ne pourra jamais atteindre
     le haut de l ecran. On la montre dans un calque pose sur le telephone
     entier, ce qui evite aussi de toucher aux hauteurs et de deranger le
     calage des cartes. */
  .contemplation {
    position: absolute; inset: 0; z-index: 40; background: #07070a;
    display: none; place-items: center; cursor: pointer;
  }
  .contemplation.ouvert { display: grid; animation: surgit .25s ease both; }
  @keyframes surgit { from { opacity: 0; } to { opacity: 1; } }
  .contemplation img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .contemplation .sortir-plein {
    position: absolute; left: 50%; transform: translateX(-50%); z-index: 2;
    bottom: calc(26px + env(safe-area-inset-bottom));
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(255,255,255,.5);
    animation: parait .5s ease .6s both;
  }
  .contemplation .credit-plein {
    position: absolute; left: 24px; right: 24px; z-index: 2;
    top: calc(18px + env(safe-area-inset-top));
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: rgba(255,255,255,.42); text-align: center;
    animation: parait .5s ease .6s both;
  }

  .carte.image { justify-content: flex-end; }
  .carte.image > *:not(.visuel):not(.loupe):not(.sortir-plein) { position: relative; z-index: 1; }
  /* Un chapitre se lit : son illustration reste, mais presque effacee, comme
     une texture. Une carte de feed est courte, elle supporte l image franche.
     Le voile ci-dessus est un degrade presque transparent en son milieu, ce qui
     convient a un titre pose en bas mais rend illisible un texte qui occupe
     toute la hauteur : on le remplace par un aplat, pas une opacite plus forte
     sur le meme degrade. */
  .carte.illustree[data-type="chapitre"] h1,
  .carte.illustree[data-type="chapitre"] p,
  .carte.illustree[data-type="chapitre"] .accroche {
    text-shadow: 0 1px 12px rgba(0,0,0,.55);
  }

  /* ---- ouverture : l image plein ecran avant que la carte se devoile ----
     Trois secondes, une seule fois par carte, coupees des qu on touche
     l ecran. L image ne disparait pas ensuite, elle devient le fond de la
     carte : le texte se pose dessus au lieu de la remplacer. */
  .ouverture {
    position: absolute; inset: 0; z-index: 35; background: #0a0908;
    overflow: hidden; cursor: pointer;
    display: none; flex-direction: column; justify-content: flex-end;
  }
  .ouverture.joue { display: flex; }
  .ouverture img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scale(1.15);
  }
  .ouverture.joue img { animation: respire 3.6s cubic-bezier(.18,0,.24,1) both; }
  @keyframes respire {
    from { transform: scale(1.15) translateY(1.5%); }
    to   { transform: scale(1) translateY(0); }
  }
  .voile-ouv {
    position: absolute; inset: 0;
    background:
      radial-gradient(118% 76% at 50% 34%, transparent 18%, rgba(6,6,8,.62) 100%),
      linear-gradient(180deg, rgba(6,6,8,.5) 0%, transparent 26%, rgba(6,6,8,.9) 100%);
  }
  .ouv-texte {
    position: relative; z-index: 2;
    padding: 0 24px calc(82px + env(safe-area-inset-bottom));
  }
  .ouverture.joue .ouv-mod { animation: monte .5s ease .3s both; }
  .ouverture.joue .ouv-titre { animation: monte .6s cubic-bezier(.2,.7,.3,1) .5s both; }
  .ouverture.joue .ouv-credit { animation: parait .6s ease 1.5s both; }
  .ouv-mod {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .ouv-titre {
    font-family: "Instrument Serif", Georgia, serif; font-size: 30px; line-height: 1.13;
    color: #fff; margin: 0; text-wrap: balance; text-shadow: 0 2px 22px rgba(0,0,0,.6);
  }
  .ouv-credit {
    position: absolute; left: 24px; right: 24px; z-index: 2;
    bottom: calc(26px + env(safe-area-inset-bottom));
    font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: .05em;
    color: rgba(255,255,255,.38); line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ouv-jauge {
    position: absolute; top: env(safe-area-inset-top); left: 0; right: 0;
    height: 2px; z-index: 3; background: rgba(255,255,255,.12);
  }
  .ouv-jauge i { display: block; height: 100%; width: 0; background: rgba(255,255,255,.7); }
  .ouverture.joue .ouv-jauge i { animation: compte 3s linear both; }
  @keyframes compte { from { width: 0; } to { width: 100%; } }
  .ouverture.sortie { animation: seretire .4s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes seretire { to { opacity: 0; transform: scale(1.04); } }

  .bloc { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 19px; }
  .cache { display: none; }
  .boutons { display: flex; gap: 10px; margin-top: 17px; flex-wrap: wrap; }
  button.pilule {
    font-family: "Karla", sans-serif; font-size: 14px; font-weight: 500;
    padding: 11px 18px; border-radius: 999px; border: 1px solid var(--rule);
    background: var(--surface-haute); color: var(--ink); cursor: pointer; flex: 1; min-width: 120px;
  }
  button.pilule.plein { background: var(--accent); border-color: var(--accent); color: #12100c; font-weight: 700; }
  /* Trois boutons cote a cote sur un telephone : la largeur minimale d une
     pilule ordinaire les ferait passer a la ligne une par une. */
  button.pilule.note { min-width: 0; padding: 11px 10px; font-size: 13px; }

  /* ---- schema ----
     Un volet entier, centre verticalement. Le dessin herite de la couleur du
     texte et de l accent du module, ce qui lui evite d avoir sa propre palette
     et le fait vivre avec le theme au lieu de flotter dessus. */
  .carte.avec-schema { display: flex; flex-direction: column; }
  .schema { margin: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .schema svg { width: 100%; height: auto; display: block; color: var(--ink); overflow: visible; }
  .schema figcaption {
    margin-top: 20px; font-family: "Karla", sans-serif; font-size: 12.5px;
    color: var(--ink-doux); text-align: center; line-height: 1.45;
  }
  button.pilule:active { transform: scale(.98); }

  .fin-chapitre { align-items: center; text-align: center; }
  .centre { width: 100%; max-width: 300px; }
  .jauge { position: relative; height: 2px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; margin-bottom: 28px; }
  .jauge i { position: absolute; inset: 0 100% 0 0; background: var(--accent); }
  .coche {
    width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--accent);
    display: grid; place-items: center; margin: 0 auto 18px; color: var(--accent);
    font-size: 23px; line-height: 1; transform: scale(.4); opacity: 0;
  }
  .cl-titre { font-family: "Instrument Serif", Georgia, serif; font-size: 25px; line-height: 1.2; opacity: 0; }
  .cl-quoi { font-size: 14px; color: var(--ink-doux); margin-top: 8px; opacity: 0; }
  .cl-sous { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .08em; color: var(--ink-faible); margin-top: 17px; opacity: 0; }
  .suivant {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 40px;
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-faible); opacity: 0;
  }
  .carte.vue .jauge i { animation: remplir .75s cubic-bezier(.4,0,.2,1) .1s both; }
  .carte.vue .coche { animation: pop .5s cubic-bezier(.34,1.56,.64,1) .6s both; }
  .carte.vue .cl-titre { animation: monte .45s ease .78s both; }
  .carte.vue .cl-quoi { animation: monte .45s ease .88s both; }
  .carte.vue .cl-sous { animation: monte .45s ease .98s both; }
  .carte.vue .suivant { animation: parait .5s ease 1.25s both; }
  .carte.vue .fleche { animation: descend 1.7s ease-in-out 1.8s infinite; }
  @keyframes remplir { from { inset: 0 100% 0 0; } to { inset: 0 0 0 0; } }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes monte { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes parait { from { opacity: 0; } to { opacity: .85; } }
  @keyframes descend { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

  .bas {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, var(--ground) 42%);
    display: flex; gap: 10px; align-items: center;
  }
  .bas button { border: none; background: none; cursor: pointer; font-family: "Karla", sans-serif; font-size: 14px; color: var(--ink-doux); padding: 12px 4px; }
  .act-lu { flex: 1; background: var(--surface-haute) !important; border: 1px solid var(--rule) !important; border-radius: 999px; color: var(--ink) !important; font-weight: 700 !important; }
  .act-icone { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--rule) !important; display: grid; place-items: center; font-size: 17px !important; }
  .act-tard { flex: none; border: 1px solid var(--rule) !important; border-radius: 999px; padding: 12px 13px !important; font-size: 13px !important; white-space: nowrap; }
  .act-icone.actif { color: #d98e8e !important; border-color: #d98e8e !important; }
  .act-lire.actif { color: #8fb996 !important; border-color: #8fb996 !important; }

  .liste-lire { margin-top: 2px; }
  .liste-lire .ligne { align-items: flex-start; }
  .lire-titre { font-size: 14px; line-height: 1.35; }
  .lire-auteur { font-size: 12px; color: var(--ink-faible); margin-top: 2px; }
  .lire-liens { display: flex; gap: 12px; margin-top: 5px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; }
  .lire-liens a { color: var(--ink-doux); }
  .oter { background: none; border: none; color: var(--ink-faible); cursor: pointer; font-size: 16px; padding: 2px 6px; flex: none; }

  .retour {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 74px; z-index: 30;
    background: rgba(20,24,26,.94); border: 1px solid var(--rule); border-radius: 999px;
    padding: 7px 15px; font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-doux); opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap;
  }
  .retour.visible { opacity: 1; }

  .panneau {
    position: absolute; inset: 0; z-index: 40; background: var(--ground);
    overflow-y: auto;
    padding: calc(22px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .32s cubic-bezier(.4,0,.2,1);
  }
  .panneau.ouvert { transform: none; }
  .panneau h2 { margin-bottom: 20px; }
  .fermer { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 18px; background: none; border: 1px solid var(--rule); color: var(--ink-doux); border-radius: 999px; width: 32px; height: 32px; cursor: pointer; font-size: 15px; }

  .anneaux { display: flex; gap: 16px; justify-content: center; margin: 4px 0 26px; flex-wrap: wrap; }
  .anneau { text-align: center; width: 84px; }
  .anneau svg { display: block; margin: 0 auto 7px; }
  .anneau-val { font-family: "JetBrains Mono", monospace; font-size: 15px; fill: #edf0ec; }
  .anneau-lib { font-family: "JetBrains Mono", monospace; font-size: 9.5px; color: var(--ink-faible); line-height: 1.35; }

  .ligne { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .ligne:last-child { border-bottom: none; }

<script type="module">
/*MOTEUR*/

/*PAQUET*/

const COULEURS = {
  "esprit-critique": ["#e0a458", "#16130e"],
  "apprendre":       ["#c9a36b", "#15130f"],
  "etat":            ["#d5a06a", "#17140f"],
  "feed-art":        ["#d98e8e", "#171013"],
  "feed-litterature":["#8fb996", "#0e1512"],
  "feed-sciences":   ["#8bb0c4", "#0d1317"],
  "feed-pratique":   ["#7fa6c4", "#0d1218"],
  "_defaut":         ["#b2a68f", "#141412"],
};
const couleurs = (m) => COULEURS[m] || COULEURS._defaut;

let paquet = null;
let etat = M.chargerEtat();
let file = [];
let cartes = [];          // cartes affichees, volets compris
let mode = "objectif";
let debutBonus = null;

const $ = (id) => document.getElementById(id);
const flux = $("flux");

/* ---------- chargement du paquet ---------- */

/* On attend les polices avant de decouper.
 *
 * Le decoupage en volets se regle sur une mesure du texte affiche. Tant que
 * Karla et Instrument Serif ne sont pas chargees, le navigateur rend avec sa
 * police de repli, plus compacte : la mesure conclut que tout tient, puis les
 * vraies polices arrivent, le texte enfle et deborde. La course est donc
 * perdue d avance si on mesure trop tot. Le delai de garde evite de bloquer
 * l application si les polices ne viennent jamais, hors ligne par exemple. */
async function policesPretes(delaiMax = 2500) {
  if (!document.fonts?.ready) return;
  await Promise.race([
    document.fonts.ready,
    new Promise((r) => setTimeout(r, delaiMax)),
  ]);
}

async function charger() {
  if (typeof PAQUET !== "undefined" && PAQUET) return PAQUET;
  const reponse = await fetch("contenu.json", { cache: "no-cache" });
  if (!reponse.ok) throw new Error("contenu.json introuvable");
  return reponse.json();
}

/* ---------- decoupage d un chapitre en volets ---------- */

let signesParPixel = 2.0;      // ajuste apres mesure, voir ajusterVolets

/* Un paragraphe plus long que la place d un volet ne peut pas tenir, quel que
   soit le budget : on le coupe entre deux phrases. Une coupure de paragraphe se
   lit sans heurt, un texte qu il faut faire defiler dans la carte, non. */
function couper(paragraphe, budget) {
  if (paragraphe.length <= budget) return [paragraphe];
  const phrases = paragraphe.match(/[^.!?…]+[.!?…]+[\s»"']*|[^.!?…]+$/g) || [paragraphe];
  const bouts = [];
  let courant = "";
  for (const phrase of phrases) {
    if (courant && (courant + phrase).length > budget) {
      bouts.push(courant.trim());
      courant = "";
    }
    courant += phrase;
  }
  if (courant.trim()) bouts.push(courant.trim());
  return bouts;
}

function volets(carte) {
  if (carte.type !== "chapitre" || !carte.contenu) return [carte];

  // Le decoupage se fait au nombre de signes, pas au nombre de paragraphes :
  // deux paragraphes longs debordent la ou quatre courts tiennent.
  //
  // La hauteur de reference est celle du flux, pas celle de la fenetre. Sur un
  // telephone la barre d adresse du navigateur mange une centaine de pixels
  // que window.innerHeight ne retire pas toujours, et un volet calcule trop
  // large deborde. Le premier volet dispose de moins de place, puisqu il porte
  // le titre du chapitre et parfois le bandeau du module.
  const hauteur = flux.clientHeight || (window.innerHeight || 800) - 150;
  const budget = Math.max(300, Math.round((hauteur - 195) * signesParPixel));
  const budgetPremier = Math.round(budget * 0.66);

  // On coupe sur la plus petite place possible, celle du premier volet : un
  // bout qui tient la tient partout, et la boucle de remplissage en regroupe
  // plusieurs sur les volets suivants.
  const paragraphes = carte.contenu
    .split(/\n{2,}/).map((p) => p.trim()).filter(Boolean)
    .flatMap((p) => couper(p, budgetPremier));

  const morceaux = [];
  let courant = [], place = budgetPremier;
  for (const paragraphe of paragraphes) {
    if (courant.length && place - paragraphe.length < 0) {
      morceaux.push(courant);
      courant = [];
      place = budget;
    }
    courant.push(paragraphe);
    place -= paragraphe.length;
  }
  if (courant.length) morceaux.push(courant);

  const suite = morceaux.map((p) => ({ ...carte, _paragraphes: p }));

  // Le schema occupe son propre volet, jamais le bas d un volet de texte : pose
  // sous des paragraphes, il fait deborder la carte de plusieurs dizaines de
  // pixels, et il se retrouve coupe ou illisible. Il s insere apres le volet qui
  // contient le paragraphe designe par schema_apres, c est-a-dire au moment ou
  // le mecanisme vient d etre pose et ou le voir sert encore a quelque chose.
  if (carte.schema) {
    let vus = 0, place = suite.length - 1;
    const cible = carte.schema_apres || 2;
    for (let i = 0; i < suite.length; i++) {
      vus += suite[i]._paragraphes.length;
      if (vus >= cible) { place = i; break; }
    }
    suite.splice(place + 1, 0, { ...carte, _schema: true, _paragraphes: [] });
  }

  return suite.map((v, i) => ({ ...v, _volet: i + 1, _volets: suite.length }));
}

/* Le calcul ci-dessus est une estimation : la vraie hauteur d un paragraphe
   depend de la police, de la largeur, des cesures. On mesure donc apres coup,
   et on resserre tant qu un volet deborde. Trois passes au maximum, sur des
   elements deja en place, donc invisible a l oeil. */
function ajusterVolets(rendre, passes = 4) {
  for (let n = 0; n < passes; n++) {
    const deborde = [...flux.children].some(
      (s) => s.dataset.type === "chapitre" && s.scrollHeight > s.clientHeight + 6
    );
    if (!deborde || signesParPixel <= 1.0) break;
    signesParPixel = Math.max(1.0, signesParPixel - 0.3);
    rendre();
  }
  degraisserFeed();
}

/* Une carte de feed ne se decoupe pas en volets : c est une accroche, pas un
 * chapitre. Quand elle deborde, elle doit rentrer, mais sans perdre ce qu on
 * vient y lire.
 *
 * On retirait les paragraphes par le bas jusqu a ce que ca tienne. Seulement la
 * legende, "Leroux, resume", est elle aussi un paragraphe, et le premier : sur
 * un resume un peu long, les trois retraits emportaient tout le corps du texte
 * et il ne restait que la legende, qui ne dit rien du livre. On protege donc le
 * corps : on enleve les paragraphes en trop, jamais le premier, puis on
 * raccourcit celui qui reste. Le lien vers la source porte la suite. */
function degraisserFeed() {
  for (const section of flux.children) degraisserCarte(section);
}

function degraisserCarte(section) {
  if (!section) return;
  if (section.dataset.type === "chapitre" || section.dataset.type === "cloture") return;
  if (tient(section)) return;

  const corps = [...section.querySelectorAll("p")].filter((p) => !p.hasAttribute("data-legende"));
  while (corps.length > 1 && !tient(section)) corps.pop().remove();
  if (corps.length && !tient(section)) rogner(section, corps[0]);
}

const tient = (section) => section.scrollHeight <= section.clientHeight + 6;

/* Raccourcit un paragraphe jusqu a ce que la carte tienne. Par dichotomie sur
 * le nombre de mots : retirer un mot a la fois demanderait des centaines de
 * mesures de mise en page sur un resume de mille signes, et chaque mesure force
 * un recalcul complet.
 *
 * On vise l ajustement exact, pas la tolerance de six pixels : la mise en page
 * bouge encore de quelques pixels apres le degraissage, quand une police de
 * substitution cede la place a la vraie, et une carte calee au pixel pres
 * ressortait alors a sept pixels de trop. Ces six pixels sont la marge. */
function rogner(section, p) {
  const mots = p.textContent.split(/\s+/).filter(Boolean);
  const cale = () => section.scrollHeight <= section.clientHeight;
  const pose = (n) => {
    p.textContent = mots.slice(0, n).join(" ").replace(/[\s,;:.…-]+$/, "") + " […]";
    return cale();
  };
  let bas = Math.min(14, mots.length);
  let haut = mots.length;
  if (!pose(bas)) return;                   // meme court, ca deborde : on laisse
  while (bas < haut - 1) {
    const milieu = Math.floor((bas + haut) / 2);
    if (pose(milieu)) bas = milieu; else haut = milieu;
  }
  pose(bas);
}

/* ---------- rendu ---------- */

function elementCarte(v, precedente, suivante) {
  const section = document.createElement("section");
  section.className = "carte" + (v._type === "cloture" ? " fin-chapitre" : "");
  section.dataset.mod = v.module;
  section.dataset.type = v._type || v.type;
  if (v.id) section.dataset.carte = v.id;

  const [accent] = couleurs(v.module);
  const nomModule = paquet.modules.find((m) => m.id === v.module)?.nom || v.module;

  // Le contenu est assemble en une seule chaine avant d etre pose : un
  // innerHTML += successif detruirait et recreerait les elements deja ajoutes,
  // en particulier la toile peinte, qui reviendrait vide.
  let html = "";

  // Changement de sujet : bandeau nomme, absent sur les clotures.
  if ((!precedente || precedente.module !== v.module) && v._type !== "cloture") {
    html += `<div class="bandeau"><i class="bandeau-filet" style="--c:${accent}"></i>
      <span class="bandeau-nom">${echappe(nomModule)}</span>
      <span class="bandeau-type">${v.type === "chapitre" ? "parcours" : "feed"}</span></div>`;
  }

  if (v._type === "cloture") {
    const versAutre = suivante && suivante.module !== v.module;
    html += `<div class="centre">
      <div class="jauge"><i></i></div>
      <div class="coche">&#10003;</div>
      <div class="cl-titre">Chapitre ${v.chapitre} terminé</div>
      <div class="cl-quoi">${echappe(v.chapitre_titre || v.titre)}</div>
      <div class="cl-sous">${v._volets} volet${v._volets > 1 ? "s" : ""} lu${v._volets > 1 ? "s" : ""}${v.rappels ? " · rappel programmé demain" : ""}</div>
      <div class="suivant">${suivante ? (versAutre ? "on change de sujet" : "chapitre suivant") : "fin du flux"} <span class="fleche">&#8595;</span></div>
    </div>`;
    section.innerHTML = html;
    return section;
  }

  if (v._type === "rappel") {
    const rang = v._rang && v._total > 1 ? ` · ${v._rang} sur ${v._total}` : "";
    html += `<div class="kicker">${v._frais
      ? `à retenir${rang}` : "rappel · à revoir"}</div>
      <div class="bloc">
        <h2>${echappe(v.q)}</h2>
        <div class="cache" data-reponse><p>${echappe(v.r)}</p>
          <div class="meta-bas">issu de : ${echappe(v.carte.titre)}</div></div>
        <div class="boutons" data-actions>
          <button class="pilule plein" type="button" data-reveler>${v._frais
            ? "Voir si c'était ça" : "Voir la réponse"}</button>
        </div>
      </div>`;
    section.innerHTML = html;
    return section;
  }

  if (v.type === "chapitre") {
    if (v._volet === 1) {
      html += `<div class="kicker"><span class="num-chapitre">${v.chapitre}</span>
        chapitre ${v.chapitre} · ${["léger", "normal", "exigeant"][v.exigence - 1]}</div>
        <h1>${echappe(v.chapitre_titre || v.titre)}</h1>`;
    } else {
      html += `<div class="suite-de">suite du chapitre ${v.chapitre} · ${echappe(v.chapitre_titre || v.titre)}</div>`;
    }
    if (v._volets > 1) {
      html += `<div class="volets">${Array.from({ length: v._volets }, (_, i) =>
        `<i class="volet-pt${i < v._volet ? " on" : ""}"></i>`).join("")}</div>`;
    }
    if (v._schema) {
      html += `<figure class="schema">${v.schema}${v.schema_legende
        ? `<figcaption>${echappe(v.schema_legende)}</figcaption>` : ""}</figure>`;
      section.innerHTML = html;
      section.classList.add("avec-schema");
      poserIllustration(section, v, accent, nomModule);
      return section;
    }
    html += v._paragraphes
      .map((p) => p.replace(/\*\*(.*?)\*\*/g, "$1"))
      .map((p, i) => (v._volet > 1 && i === 0 && p.length < 180)
        ? `<div class="accroche">${echappe(p)}</div>`
        : `<p>${echappe(p)}</p>`)
      .join("");
    section.innerHTML = html;
    poserIllustration(section, v, accent, nomModule);
    return section;
  }

  // Carte de feed
  const visuel = v.media_type === "image";
  html += `<div class="kicker">${visuel ? "œuvre du jour" : "à lire"}</div>
    <h2>${echappe(v.titre)}</h2>
    ${v.extrait ? `<p data-legende style="color:var(--ink-doux)">${echappe(v.extrait)}</p>` : ""}
    ${texteCarte(v.contenu, v.extrait, v.titre).slice(0, 3).map((p) => `<p>${echappe(p)}</p>`).join("")}
    ${(v.attribution || v.url) ? `<div class="meta-bas">${echappe(v.attribution || "")}${
      v.url ? `<br><a href="${v.url}" target="_blank" rel="noopener">ouvrir la source</a>` : ""}</div>` : ""}`;
  section.innerHTML = html;

  if (visuel && !v.image) {
    section.classList.add("image");
    const d = document.createElement("div");
    d.className = "visuel cadre";
    d.innerHTML = plaque(v, accent);
    if (v.media) {
      // L image reelle recouvre le cadre une fois chargee. Si elle echoue
      // (hors ligne, source disparue, previsualisation qui bloque les hotes
      // externes), le cadre reste, et la carte tient quand meme debout.
      const img = new Image();
      img.loading = "lazy"; img.alt = "";
      img.addEventListener("load", () => {
        d.innerHTML = ""; d.className = "visuel"; d.appendChild(img);
      });
      img.src = v.media;
    }
    section.insertBefore(d, section.firstChild);
  }
  poserIllustration(section, v, accent, nomModule);

  // Une oeuvre ou une carte de feed illustree merite d etre regardee sans que
  // le texte passe devant. Pas sur un chapitre : la on vient lire.
  if (section.querySelector(".visuel img")) {
    const loupe = document.createElement("button");
    loupe.type = "button";
    loupe.className = "loupe";
    loupe.dataset.plein = "1";
    loupe.setAttribute("aria-label", "Voir l’image en plein écran");
    loupe.innerHTML = "&#10530;";
    section.appendChild(loupe);
  }
  return section;
}

/* Certaines cartes deja en base portent du markdown dans leur contenu, ou
   repetent mot pour mot ce que dit deja leur legende. On nettoie a l affichage
   plutot que d exiger une reingestion de tout le catalogue. */
function texteCarte(brut, extrait, titre) {
  if (!brut) return [];
  return brut
    .split(/\n{2,}/)
    .map((p) => p.replace(/\*\*(.*?)\*\*/g, "$1")   // gras markdown
                 .replace(/(^|\s)[*_](\S[^*_]*?)[*_](?=\s|$|[.,;:!?])/g, "$1$2")
                 .replace(/^#+\s*/, "")
                 .trim())
    .filter((p) => {
      if (!p) return false;
      const nu = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9àâäéèêëîïôöùûüç]+/g, "");
      const propre = nu(p);
      if (!propre) return false;
      if (propre === nu(titre)) return false;              // le titre, redit
      if (nu(extrait).includes(propre)) return false;      // deja dans la legende
      return true;
    });
}

function echappe(t) {
  return String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* Cadre d une oeuvre : ce qu on montre tant qu il n y a pas d image. */
function plaque(v, accent) {
  const parts = String(v.extrait || "").split(",").map((t) => t.trim()).filter(Boolean);
  const auteur = parts[0] || "Anonyme";
  const date = parts[1] || "";
  return `<div class="plaque" style="--c:${accent}">
    <div class="plaque-cadre"><div class="cartel">${echappe(auteur)}${
      date ? `<i></i>${echappe(date)}` : ""}</div></div>
  </div>`;
}

/* ---------- ouverture animee ----------
 * L illustration s affiche en plein ecran trois secondes avant que la carte
 * ne se devoile, puis reste en fond. Un appui coupe l attente : on ne bloque
 * jamais quelqu un qui veut lire tout de suite.
 */

const DUREE_OUVERTURE = 3000;
const sobre = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const ouvertes = new Set();          // cartes deja ouvertes, pour ne pas rejouer

function poserIllustration(section, v, accent, nomModule) {
  if (!v.image) return;
  section.classList.add("illustree");

  // Une oeuvre garde son visuel dans la carte : l image y est cadree en entier
  // avec son cartel dessous, c est une composition, pas un fond. Tout le reste
  // passe par le fond partage, qui ne bouge pas d un volet a l autre.
  if (v.media_type !== "image") return;

  section.classList.add("image", "oeuvre");
  const zone = document.createElement("div");
  zone.className = "visuel";
  const img = new Image();
  img.alt = ""; img.src = v.image;
  zone.appendChild(img);
  section.insertBefore(zone, section.firstChild);
}

/* Pose l image de fond de la carte courante. Ne fait rien si c est deja la
   bonne : c est ce silence qui rend le fond immobile entre deux volets. */
function poserFond(v) {
  const fond = $("fond");
  const url = (v && v.image && v.media_type !== "image") ? v.image : "";
  fond.classList.toggle("lecture", v?.type === "chapitre");
  if (fond.dataset.url === url) return;
  fond.dataset.url = url;

  const couches = fond.querySelectorAll("img");
  const actif = fond.querySelector("img.visible");
  if (!url) {
    couches.forEach((c) => c.classList.remove("visible"));
    return;
  }
  const dormant = actif === couches[0] ? couches[1] : couches[0];
  const montrer = () => {
    dormant.classList.add("visible");
    if (actif) actif.classList.remove("visible");
  };
  if (dormant.getAttribute("src") === url) { montrer(); return; }
  dormant.src = url;
  if (dormant.decode) dormant.decode().then(montrer).catch(montrer);
  else dormant.addEventListener("load", montrer, { once: true });
}

let sequenceOuverture = 0;

function fermerOuverture() {
  const o = $("ouverture");
  if (!o.classList.contains("joue")) return;
  clearTimeout(o._t);
  o.classList.add("sortie");

  // Le nettoyage arrive 400 ms plus tard, le temps de l animation de sortie. Si
  // une nouvelle ouverture a demarre entre-temps, ce nettoyage la tuerait : on
  // ne l applique donc que si rien n a commence depuis.
  const mienne = ++sequenceOuverture;
  setTimeout(() => {
    if (mienne !== sequenceOuverture) return;
    o.classList.remove("joue", "sortie");
    o.innerHTML = "";
  }, 400);
}

/* Jouee au moment ou la carte arrive au centre, pas a la construction : sinon
   les trois secondes s ecouleraient pendant qu on lit la carte precedente.
   Un appui sur l image la coupe : on ne bloque jamais quelqu un qui veut lire
   tout de suite. */
function jouerOuverture(index) {
  const o = $("ouverture");
  const v = cartes[index];
  const cle = `${v?.id}:${v?._volet || 1}`;

  // Deja en train de jouer pour cette carte : on la laisse aller au bout. Sans
  // ce garde-fou, le premier evenement de defilement coupe l ouverture d accueil
  // une fraction de seconde apres l avoir lancee.
  if (o.dataset.cle === cle && o.classList.contains("joue")) return;

  // Si une autre ouverture joue encore, c est qu on l a traversee sans la voir :
  // on lui rend son tour plutot que de la consommer pour rien.
  if (o.classList.contains("joue") && !o.classList.contains("sortie") && o.dataset.cle) {
    ouvertes.delete(o.dataset.cle);
  }

  if (!v || !v.image || !v._ouvre || sobre || ouvertes.has(cle)) {
    fermerOuverture();
    return;
  }
  ouvertes.add(cle);
  o.dataset.cle = cle;
  sequenceOuverture += 1;              // annule un nettoyage encore en attente

  const [accent] = couleurs(v.module);
  const nom = paquet.modules.find((m) => m.id === v.module)?.nom || v.module;
  clearTimeout(o._t);
  o.classList.remove("sortie");
  o.innerHTML = `<img alt="" src="${v.image}">
    <div class="voile-ouv"></div>
    <div class="ouv-jauge"><i></i></div>
    <div class="ouv-texte">
      <div class="ouv-mod"><i class="point-mod" style="background:${accent}"></i>${echappe(nom)}</div>
      <h2 class="ouv-titre">${echappe(v.chapitre_titre || v.titre)}</h2>
    </div>
    ${v.image_credit ? `<div class="ouv-credit">${echappe(v.image_credit)}</div>` : ""}`;
  o.classList.add("joue");
  o._t = setTimeout(fermerOuverture, DUREE_OUVERTURE);
}

/* Il y avait ici un second garde-fou qui annulait l ouverture si le defilement
 * bougeait encore dans la demi-seconde. Il partait d une detection qui pouvait
 * se declencher trop tot, et sur iOS c est lui qui tuait les animations :
 * le calage magnetique deplace encore la page de plusieurs dizaines de pixels
 * apres que la derive est devenue indetectable, ce qu il prenait pour un geste
 * qui reprend. Depuis que l arrivee est constatee par l observateur, une
 * ouverture ne demarre plus avant que la carte occupe l ecran, et il n y a plus
 * rien a annuler. Une carte traversee malgre tout recupere son tour dans
 * jouerOuverture, au moment ou la suivante se presente. */

/* Un debordement constate a l usage vaut mieux qu une mesure faite une fois.
 *
 * Le decoupage se regle sur une mesure prise au chargement. Tout ce qui change
 * les dimensions du texte apres coup lui echappe : une police qui arrive en
 * retard, une rotation, un reglage d accessibilite qui grossit les caracteres.
 * On verifie donc la carte courante a chaque fois qu elle change, et on refait
 * le decoupage si elle deborde. Deux fois au maximum, pour ne pas boucler sur
 * un texte que rien ne fera tenir. */
let recalagesRestants = 2;

/* Reconstruire en restaurant la position en PIXELS est pire que le mal : apres
   un nouveau decoupage, le meme nombre de pixels ne designe plus la meme carte,
   et on se retrouve avec l en-tete d un module sur le contenu d un autre. On
   repere donc la carte par son identite, chapitre et volet, et on la retrouve
   apres coup. La file elle-meme n est pas rejouee : changer la selection sous
   les yeux de celui qui lit serait pire encore. */
function reconstruire() {
  const index = Math.min(Math.round(flux.scrollTop / (flux.clientHeight || 1)),
                         Math.max(0, cartes.length - 1));
  const repere = cartes[index];
  const identite = (v) => `${v.id}:${v._volet || 1}:${v._type || ""}`;
  const cle = repere ? identite(repere) : null;

  batirFlux({ conserverFile: true });
  calculerTeintes();

  let cible = cle === null ? 0 : cartes.findIndex((v) => identite(v) === cle);
  if (cible < 0 && repere) cible = cartes.findIndex((v) => v.id === repere.id);
  cible = Math.max(0, cible);

  flux.scrollTo({ top: cible * flux.clientHeight, behavior: "instant" });
  dernierCentre = -1;                 // force le repeint de l en-tete et du fond
  peindre();
}

function verifierDebordement(index) {
  const section = flux.children[index];
  if (!section || tient(section)) return;

  // Une carte de feed se regle toute seule, en place : reconstruire tout le
  // flux pour elle changerait le decoupage des chapitres sans raison, et le
  // budget de recalages est precieux.
  if (section.dataset.type !== "chapitre") { degraisserCarte(section); return; }

  if (recalagesRestants <= 0) return;
  recalagesRestants -= 1;
  signesParPixel = Math.max(1.0, signesParPixel - 0.3);
  reconstruire();
}

/* Les images des cartes suivantes sont chargees d avance : une ouverture qui
   demarre sur un ecran noir rate exactement ce qu elle vient chercher. */
function precharger(depuis, combien = 3) {
  for (let i = depuis; i < Math.min(cartes.length, depuis + combien); i++) {
    const url = cartes[i]?.image;
    if (url && !precharger._vues.has(url)) {
      precharger._vues.add(url);
      const img = new Image();
      img.src = url;
      // Charger ne suffit pas : sans decodage prealable, le premier affichage
      // coute encore quelques millisecondes de page noire.
      if (img.decode) img.decode().catch(() => {});
    }
  }
}
precharger._vues = new Set();

/* ---------- construction du flux ---------- */

function batirFlux(options = {}) {
  // conserverFile : on refait le decoupage et le rendu, pas le choix des cartes.
  // Rejouer la selection en pleine lecture changerait le flux sous les yeux de
  // celui qui lit, ce qui est exactement ce qu il ne faut jamais faire.
  const objectif = etat.objectif || paquet.reglages?.objectif_cartes_jour || 12;
  if (!options.conserverFile || !file.length) {
    file = M.construireFile(paquet, etat, { taille: objectif, mode });
  }
  const dus = options.conserverFile
    ? cartes.filter((v) => v._type === "rappel")
    : (mode === "objectif" ? M.rappelsDus(etat, paquet) : []);

  // Le decoupage et le rendu sont refaits tels quels si une mesure montre
  // qu un volet deborde : c est le seul moyen fiable de savoir ce qui tient.
  const rendre = () => {
    cartes = [];
    for (const r of dus) {
      cartes.push({ ...r, module: r.carte.module, _type: "rappel", type: "rappel" });
    }
    for (const carte of file) {
      const suite = volets(carte);
      suite[0]._ouvre = true;          // seul le premier volet ouvre
      cartes.push(...suite);
      if (carte.type === "chapitre") {
        cartes.push({ ...carte, _type: "cloture", _volets: suite.length });
        // Se tester juste apres avoir lu vaut mieux que relire : c est l effet
        // de test, et c est le sujet du chapitre 4 du parcours "apprendre". La
        // question arrive donc immediatement apres l ecran de fin de chapitre,
        // puis la meme carte revient plus tard, espacee selon la reponse.
        (carte.rappels || []).forEach((r, i, liste) => {
          cartes.push({ ...r, module: carte.module, carte,
                        _type: "rappel", type: "rappel", _frais: true,
                        _rang: i + 1, _total: liste.length });
        });
      }
    }
    flux.innerHTML = "";
    cartes.forEach((v, i) => flux.appendChild(elementCarte(v, cartes[i - 1], cartes[i + 1])));
  };

  rendre();
  if (!cartes.length) {
    flux.innerHTML = `<div class="attente">Plus rien à lire pour aujourd'hui.<br><br>
      Relance la production sur ton ordinateur,<br>ou active un module en réserve dans les réglages.</div>`;
    $("bas").style.display = "none";
    return;
  }
  ajusterVolets(rendre);

  batirSegments();
  observerClotures();
  // L observateur suit les cartes qui viennent d etre creees : sans ce rappel,
  // une reconstruction laisserait l ancien observateur sur des elements qui ne
  // sont plus dans la page, et plus aucune arrivee ne serait constatee.
  observerCartes();
  if (!options.conserverFile) {
    peindreEntete(0);
    poserFond(cartes[0]);
    jouerOuverture(0);
    precharger(0, 4);
  }
}

function batirSegments() {
  const segments = $("segments");
  segments.innerHTML = "";
  let groupe = null, precedent = null;
  cartes.forEach((v, i) => {
    if (v._volet > 1 || v._type === "cloture") return;   // une unite par carte
    if (!groupe || precedent !== v.module) {
      groupe = document.createElement("div");
      groupe.className = "groupe-seg";
      groupe.dataset.n = 0;
      segments.appendChild(groupe);
      precedent = v.module;
    }
    const s = document.createElement("div");
    s.className = "seg";
    s.dataset.index = i;
    s.style.setProperty("--c", couleurs(v.module)[0]);
    groupe.appendChild(s);
    groupe.dataset.n = Number(groupe.dataset.n) + 1;
    groupe.style.setProperty("--poids", groupe.dataset.n);
  });
}

/* ---------- couleurs continues pendant le defilement ---------- */

function tsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return { h: 0, s: 0, l: l * 100 };
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: h * 60, s: s * 100, l: l * 100 };
}
function melange(a, b, t) {
  let dh = b.h - a.h;
  if (dh > 180) dh -= 360; else if (dh < -180) dh += 360;
  return { h: (a.h + dh * t + 360) % 360, s: a.s + (b.s - a.s) * t, l: a.l + (b.l - a.l) * t };
}
const enTsl = (c) => `hsl(${c.h.toFixed(1)} ${c.s.toFixed(1)}% ${c.l.toFixed(1)}%)`;

function teintesDe(v, indexChapitre) {
  const [accent, fond] = couleurs(v.module);
  const a = tsl(accent), f = tsl(fond);
  const palier = (indexChapitre % 4) * 2.6;    // un cran plus clair par chapitre
  return { accent: { ...a, l: a.l + (palier / 2.6) * 1.2 }, fond: { ...f, l: f.l + palier } };
}

let teintes = [];
function calculerTeintes() {
  let palier = -1, precedent = null, dernierChapitre = null;
  teintes = cartes.map((v) => {
    const clef = v.type === "chapitre" ? `${v.module}#${v.chapitre}` : `${v.module}#${v.id}`;
    if (precedent !== v.module) { palier = 0; }
    else if (clef !== dernierChapitre) { palier += 1; }
    precedent = v.module; dernierChapitre = clef;
    return teintesDe(v, palier);
  });
}

let dernierCentre = -1, enAttente = false;
function peindre() {
  const H = flux.clientHeight || 1;
  const pos = Math.max(0, flux.scrollTop / H);
  const i = Math.min(cartes.length - 1, Math.floor(pos));
  const j = Math.min(cartes.length - 1, i + 1);
  const t = Math.min(1, Math.max(0, pos - i));
  if (!teintes[i]) return;
  const racine = document.documentElement;
  racine.style.setProperty("--ground", enTsl(melange(teintes[i].fond, teintes[j].fond, t)));
  racine.style.setProperty("--accent", enTsl(melange(teintes[i].accent, teintes[j].accent, t)));
  // Le fond n est plus pose ici. Tant qu il suivait la position du defilement,
  // il basculait avant la fin du geste et l ecran de fin de chapitre portait
  // l image de la carte suivante. C est desormais confirmerArrivee, et elle
  // seule, qui le change, une fois la carte vraiment a l ecran.

  const centre = Math.round(pos);
  if (centre !== dernierCentre) {
    const precedent = dernierCentre;
    dernierCentre = centre;
    if (centre > precedent) quitter(precedent);
    const index = Math.min(centre, cartes.length - 1);
    peindreEntete(index);
    atteindre(index);
    precharger(index + 1);
    verifierDebordement(index);
  }
}

/* Une carte laissee derriere soi sans un geste est un desinteret discret : on
   l enregistre, sans jamais demander a Damien de cliquer pour dire qu il
   n aime pas. Les chapitres en sont exclus, on les traverse volet par volet. */
function dejaNote(id, actions = ["vue", "terminee", "passee", "aimee", "reportee"]) {
  return etat.evenements.some((e) => e.carte === id && actions.includes(e.action));
}

function noter(v, action) {
  if (!v || !v.id || dejaNote(v.id)) return false;
  const carte = paquet.cartes.find((c) => c.id === v.id);
  if (!carte) return false;
  M.journaliser(etat, carte, action, mode);
  sauver();
  return true;
}

/* Une carte laissee derriere soi est consommee, et doit cesser de revenir.
 *
 * Tant que seul un appui sur "J ai lu" comptait, traverser tout un chapitre en
 * swipant ne laissait aucune trace : a la reouverture, le moteur reconstruisait
 * la meme file et on retombait sur le meme chapitre indefiniment. On enregistre
 * donc le passage, avec l action "vue" : elle exclut la carte des prochaines
 * files sans peser sur l appetence, contrairement a "passee" qui vaut rejet.
 * Il n y a aucune raison de compter comme un desinteret une carte qu on vient
 * justement de lire. */
function quitter(index) {
  const v = cartes[index];
  if (!v || !v.id) return;
  // Une carte de rappel porte l identifiant du rappel, pas celui d une carte de
  // contenu. Le passer a noter() ferait chercher une carte du paquet portant ce
  // meme numero, et il en existe : on marquerait alors comme vue une carte qu on
  // n a jamais ouverte, qui ne reviendrait plus jamais.
  if (v._type === "rappel") return;
  // Un volet isole ne dit rien du chapitre : c est la carte de fin qui tranche.
  if (v.type === "chapitre" && v._type !== "cloture") return;
  noter(v, "vue");
}

/* Fermer l application sur une carte vaut passage : sinon la derniere carte du
   flux, celle qu on ne quitte jamais, reviendrait a chaque ouverture. */
for (const evenement of ["pagehide", "blur"]) {
  window.addEventListener(evenement, () => quitter(indexCourant()));
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") quitter(indexCourant());
});

/* Atteindre la carte de fin de chapitre, c est l avoir lu. C est le seul
   endroit ou le passage vaut achevement, et il fait avancer l objectif du
   jour comme le ferait un appui sur "J ai lu". */
function atteindre(index) {
  const v = cartes[index];
  if (!v || v._type !== "cloture" || dejaNote(v.id)) return;
  if (!noter(v, "terminee")) return;
  const session = M.sessionDuJour(etat, etat.objectif || 12);
  session.vues += 1;
  if (session.vues >= session.objectif && !session.atteint) {
    session.atteint = true;
    setTimeout(() => ouvrirFin(), 400);
  }
  sauver();
  peindreEntete(index);
}

function peindreEntete(index) {
  const v = cartes[index];
  if (!v) return;
  const nom = paquet.modules.find((m) => m.id === v.module)?.nom || v.module;
  $("module-txt").textContent = v._type === "cloture" ? `${nom} · chapitre terminé`
    : v._type === "rappel" ? `${nom} · rappel`
    : v._volets > 1 ? `${nom} · volet ${v._volet}/${v._volets}` : nom;

  const session = M.sessionDuJour(etat, etat.objectif || 12);
  $("compteur").textContent = `${session.vues} / ${session.objectif}`;

  document.querySelectorAll(".seg").forEach((s) => {
    const i = Number(s.dataset.index);
    s.classList.toggle("active", i <= index && (cartes[i + 1] === undefined || i + 1 > index));
    s.classList.toggle("faite", estLue(cartes[i]));
  });

  const sansActions = v._type === "cloture" || v._type === "rappel";
  $("bas").style.display = sansActions ? "none" : "flex";
  $("b-aime").classList.remove("actif");

  const lire = $("b-lire");
  lire.style.display = v.oeuvre ? "grid" : "none";
  lire.classList.toggle("actif", !!v.oeuvre && estDansListe(v.oeuvre));
}

const estLue = (v) => v && v.id && etat.evenements.some((e) => e.carte === v.id && e.action === "terminee");

/* ---------- interactions ---------- */

function indexCourant() { return Math.round(flux.scrollTop / (flux.clientHeight || 1)); }

/* Un saut programme n a plus besoin de retenir sa destination pour empecher les
   cartes traversees de jouer leur ouverture : l observateur ne conclut a une
   arrivee qu apres 180 ms sans franchissement, et une carte survolee pendant un
   defilement anime n a jamais ce calme. */
function allerA(i) {
  const cible = Math.min(i, cartes.length - 1);
  flux.scrollTo({ top: cible * flux.clientHeight, behavior: "smooth" });
}

function finUnite(depart) {
  let i = depart;
  while (i + 1 < cartes.length && cartes[i + 1].id === cartes[depart].id
         && cartes[i + 1]._type !== "cloture") i++;
  if (i + 1 < cartes.length && cartes[i + 1]._type === "cloture"
      && cartes[i + 1].id === cartes[depart].id) return i + 1;
  return i;
}

function avancer() {
  const i = indexCourant();
  const fin = finUnite(i);
  allerA(i < fin ? fin : fin + 1);
}

function annoncer(texte) {
  const r = $("retour");
  r.textContent = texte;
  r.classList.add("visible");
  clearTimeout(r._t);
  r._t = setTimeout(() => r.classList.remove("visible"), 1600);
}

let sauvegardeMuette = false;

function sauver() {
  const ok = M.sauverEtat(etat);
  if (!ok && !sauvegardeMuette) {
    sauvegardeMuette = true;
    annoncer("progression non enregistrée par le navigateur");
  }
  return ok;
}

/* Liste de lecture.
 *
 * Une carte qui presente une oeuvre porte de quoi la retrouver : titre, auteur,
 * lien vers le texte integral. Si le resume convainc, un geste suffit a la
 * mettre de cote. La liste vit dans le telephone, comme la progression, et se
 * consulte dans l ecran de progression. */
function listeLecture() {
  if (!Array.isArray(etat.aLire)) etat.aLire = [];
  return etat.aLire;
}

function estDansListe(oeuvre) {
  return listeLecture().some((o) => o.titre === oeuvre?.titre);
}

function basculerLire() {
  const v = cartes[indexCourant()];
  if (!v?.oeuvre) return;
  const liste = listeLecture();
  const place = liste.findIndex((o) => o.titre === v.oeuvre.titre);
  if (place >= 0) {
    liste.splice(place, 1);
    annoncer("retirée de la liste");
  } else {
    liste.push({ ...v.oeuvre, source: v.url || null, date: Date.now() });
    annoncer("ajoutée à ta liste de lecture");
  }
  sauver();
  $("b-lire").classList.toggle("actif", estDansListe(v.oeuvre));
}

$("b-lire").addEventListener("click", basculerLire);

function marquer(action) {
  const v = cartes[indexCourant()];
  if (!v || !v.id) return;
  const carte = paquet.cartes.find((c) => c.id === v.id);
  if (!carte) return;
  if (etat.evenements.some((e) => e.carte === carte.id && ["terminee", "passee"].includes(e.action))) {
    avancer(); return;
  }

  M.journaliser(etat, carte, action, mode);
  if (action === "terminee") {
    const session = M.sessionDuJour(etat, etat.objectif || 12);
    session.vues += 1;
    if (session.vues >= session.objectif && !session.atteint) {
      session.atteint = true;
      setTimeout(() => ouvrirFin(), 400);
    }
  }
  sauver();
  peindreEntete(indexCourant());
}

$("b-lu").addEventListener("click", () => {
  marquer("terminee");
  const v = cartes[indexCourant()];
  annoncer(v?.rappels ? "lue · rappel programmé demain" : "lue");
  avancer();
});
$("b-aime").addEventListener("click", () => {
  $("b-aime").classList.add("actif");
  const v = cartes[indexCourant()];
  if (v?.id) {
    const carte = paquet.cartes.find((c) => c.id === v.id);
    if (carte) M.journaliser(etat, carte, "aimee", mode);
  }
  marquer("terminee");
  annoncer("aimée · plus de ce sujet");
  setTimeout(avancer, 260);
});

/* La fin de l unite en cours, rappels frais compris.
   finUnite s arrete a l ecran de cloture, et les cartes de rappel qui le
   suivent appartiennent encore au chapitre : les laisser derriere ferait
   interroger sur un texte qu on vient justement de repousser. */
function finUniteComplete(depart) {
  let i = finUnite(depart);
  while (i + 1 < cartes.length && cartes[i + 1]._type === "rappel"
         && cartes[i + 1]._frais && cartes[i + 1].carte?.id === cartes[depart].id) i++;
  return i;
}

/* "Plus tard" : passer la carte, et changer de sujet.
 *
 * Le moteur repartit les themes sur la file entiere. C est juste sur une
 * journee et faux dans la minute : on ne lit qu une poignee de cartes par
 * session, et si les deux premieres viennent du meme parcours, c est ce
 * parcours-la qu on a l impression de subir. Aucun reglage de score ne repare
 * ca, parce que la lassitude ne se devine pas de l exterieur. Un bouton, si :
 * il dit ou en est la personne, maintenant.
 *
 * Trois effets, du plus immediat au plus durable. A l ecran, le reste de
 * l unite en cours quitte le flux et l unite suivante d un autre module vient
 * se placer juste apres la carte affichee, pour que le geste reste un seul pas
 * vers l avant. Dans le journal, l action "reportee" : ni "vue" ni "passee", la
 * carte reviendra donc, mais pas avant deux jours. Et le module est note comme
 * repousse, ce qui le penalise dans les files construites dans les
 * vingt-quatre heures. */
function reporter() {
  const i = indexCourant();
  const v = cartes[i];
  if (!v || !v.id || v._type === "rappel") return;

  const carte = paquet.cartes.find((c) => c.id === v.id);
  if (carte && !dejaNote(v.id)) {
    M.journaliser(etat, carte, "reportee", mode);
    etat.reports = etat.reports || {};
    etat.reports[carte.module] = Date.now();
    sauver();
  }

  const fin = finUniteComplete(i);
  let cible = -1;
  for (let j = fin + 1; j < cartes.length; j++) {
    if (cartes[j]._ouvre && cartes[j].module !== v.module) { cible = j; break; }
  }

  // Plus rien d un autre sujet dans ce qui reste : on refait la file entiere.
  // Le module vient d etre penalise, elle ne s ouvrira donc pas sur lui.
  if (cible < 0) {
    file = [];
    batirFlux();
    calculerTeintes();
    flux.scrollTo({ top: 0 });
    peindre();
    annoncer("plus tard · on change de sujet");
    return;
  }

  const finCible = finUniteComplete(cible);
  const enfants = [...flux.children];
  const ancre = enfants[i];
  for (const noeud of enfants.slice(i + 1, fin + 1)) noeud.remove();
  let apres = ancre;
  for (const noeud of enfants.slice(cible, finCible + 1)) { apres.after(noeud); apres = noeud; }

  cartes = [
    ...cartes.slice(0, i + 1),
    ...cartes.slice(cible, finCible + 1),
    ...cartes.slice(fin + 1, cible),
    ...cartes.slice(finCible + 1),
  ];

  // La file suit le meme ordre, sinon un changement de taille de texte, qui
  // reconstruit le flux a partir d elle, ramenerait la carte repoussee.
  const vus = new Set();
  const ordre = [];
  for (const c of cartes) {
    if (c._type === "cloture" || c._type === "rappel" || vus.has(c.id)) continue;
    vus.add(c.id);
    const source = file.find((f) => f.id === c.id);
    if (source) ordre.push(source);
  }
  file = ordre;

  batirSegments();
  calculerTeintes();
  observerClotures();
  observerCartes();
  precharger(i + 1, 3);
  annoncer("plus tard · on change de sujet");
  allerA(i + 1);
}

$("b-tard").addEventListener("click", reporter);

function basculerPlein(section, actif) {
  const calque = $("contemplation");
  const image = section?.querySelector(".visuel img");

  if (actif && !image) return;
  if (actif) {
    calque.querySelector("img").src = image.currentSrc || image.src;
    // Le cartel doit venir de la carte sur laquelle on a appuye, pas de celle
    // que la position du flux laisse deviner : indexCourant() arrondit, et un
    // pouce pose entre deux cartes donnait le titre de la voisine, donc une
    // tapisserie du Met legendee par un article d informatique.
    const rang = [...flux.children].indexOf(section);
    const v = cartes[rang >= 0 ? rang : indexCourant()];
    calque.querySelector(".credit-plein").textContent =
      [v?.titre, v?.extrait].filter(Boolean).join(" · ");
  }
  calque.classList.toggle("ouvert", actif);
  $("tel").classList.toggle("plein", actif);
  // Le flux ne doit pas defiler sous l image pendant qu on la regarde.
  flux.style.overflowY = actif ? "hidden" : "auto";
}

$("contemplation").addEventListener("click", () => basculerPlein(null, false));

flux.addEventListener("click", (e) => {
  const section = e.target.closest(".carte");
  if (!section) return;

  if (e.target.matches("[data-plein]")) {
    basculerPlein(section, true);
    return;
  }
  if (e.target.matches("[data-reveler]")) {
    section.querySelector("[data-reponse]").classList.remove("cache");
    // Trois niveaux : "a peu pres" est l etat le plus courant, et le ranger de
    // force dans l une des deux autres cases faussait tout l espacement.
    section.querySelector("[data-actions]").innerHTML =
      `<button class="pilule note" type="button" data-su="0">Pas du tout</button>
       <button class="pilule note" type="button" data-su="1">À peu près</button>
       <button class="pilule note plein" type="button" data-su="2">Facile</button>`;
    return;
  }
  if (e.target.matches("[data-su]")) {
    const note = Number(e.target.dataset.su);
    // La carte cliquee, pas celle que la position du flux laisse deviner.
    const rang = [...flux.children].indexOf(section);
    const v = cartes[rang >= 0 ? rang : indexCourant()];
    M.planifierRappel(etat, v.id ?? v.rappelId ?? v.q, note);
    M.sauverEtat(etat);
    const quand = etat.rappels[v.id ?? v.rappelId ?? v.q];
    const jours = Math.max(1, Math.round((quand.prochaine - Date.now()) / 86400000));
    annoncer(jours === 1 ? "revu demain" : `revu dans ${jours} jours`);
    setTimeout(avancer, 320);
  }
});

$("ouverture").addEventListener("click", fermerOuverture);

/* L arrivee sur une carte, demandee au navigateur plutot que devinee.
 *
 * Quatre approches par la position du defilement ont echoue avant celle-ci, et
 * toutes pour la meme raison de fond : sur Safari iOS, scrollTop pendant un
 * lancer de doigt ne dit ni ou l on est ni ou l on va. Se fier au numero de la
 * carte centree declenchait l animation de chaque carte survolee. Attendre un
 * delai fixe coutait une demi-seconde de latence. Attendre un silence des
 * evenements de defilement supposait qu ils arrivent regulierement, ce que iOS
 * ne fait pas, il les emet par paquets separes de trous. Et mesurer une
 * immobilite image par image butait sur le calage magnetique, qui continue de
 * deplacer la page apres que la derive est devenue indetectable, si bien que
 * l ouverture demarrait puis se faisait annuler par son propre garde-fou.
 *
 * On ne mesure donc plus rien. Un IntersectionObserver dit quelle carte occupe
 * l ecran, c est sa definition meme, et il est calcule par le moteur de rendu
 * au bon moment sans dependre du rythme des evenements. Le fond et l ouverture
 * suivent cette seule source, ce qui garantit aussi qu ils ne peuvent plus se
 * contredire : l ecran de fin de chapitre ne peut plus porter l image de la
 * carte d apres, puisque rien ne pose le fond avant d etre arrive. */

const PART_VISIBLE = 0.9;     // part de la carte a l ecran pour dire qu on y est
const REPOS = 180;            // ms sans changement avant de conclure a l arrivee

let observateur = null;
let arrivee = -1;             // carte sur laquelle on est pose
let minuterieArrivee = null;

function observerCartes() {
  clearTimeout(minuterieArrivee);
  arrivee = -1;
  if (observateur) observateur.disconnect();
  if (!("IntersectionObserver" in window)) return;

  observateur = new IntersectionObserver((entrees) => {
    // On ne retient que la carte la plus visible du lot : pendant un geste, le
    // navigateur signale a la fois celle qu on quitte et celle qu on gagne.
    let meilleure = null;
    for (const e of entrees) {
      if (!meilleure || e.intersectionRatio > meilleure.intersectionRatio) meilleure = e;
    }
    if (!meilleure || meilleure.intersectionRatio < PART_VISIBLE) return;

    const index = [...flux.children].indexOf(meilleure.target);
    if (index < 0) return;
    // Chaque franchissement repousse l echeance : une carte traversee dans un
    // lancer n a jamais ses 180 ms de calme, donc elle ne declenche rien.
    clearTimeout(minuterieArrivee);
    minuterieArrivee = setTimeout(() => confirmerArrivee(index), REPOS);
  }, { root: flux, threshold: [0, 0.5, 0.75, PART_VISIBLE, 0.99] });

  for (const section of flux.children) observateur.observe(section);
}

function confirmerArrivee(index) {
  const v = cartes[index];
  if (!v || index === arrivee) return;
  arrivee = index;
  poserFond(v);
  jouerOuverture(index);
}

/* Filet de securite, pour le cas ou l observateur resterait muet : quelques
   navigateurs ne recalculent pas l intersection quand le defilement se termine
   exactement sur un seuil. Un defilement qui s arrete plus de 250 ms confirme
   donc l arrivee lui-meme. Il ne precede jamais l observateur, il le rattrape. */
let finDuDefilement = null;
function guetterFinDuDefilement() {
  clearTimeout(finDuDefilement);
  finDuDefilement = setTimeout(() => {
    const H = flux.clientHeight || 1;
    const pos = flux.scrollTop / H;
    const index = Math.min(Math.round(pos), cartes.length - 1);
    if (Math.abs(pos - index) < 0.08) confirmerArrivee(index);
  }, 250);
}

flux.addEventListener("scroll", () => {
  guetterFinDuDefilement();
  if (enAttente) return;
  enAttente = true;
  requestAnimationFrame(() => { enAttente = false; peindre(); });
}, { passive: true });
window.addEventListener("resize", peindre);

function observerClotures() {
  if (!("IntersectionObserver" in window)) {
    document.querySelectorAll(".fin-chapitre").forEach((c) => c.classList.add("vue"));
    return;
  }
  const guetteur = new IntersectionObserver((entrees) => {
    entrees.forEach((e) => { if (e.isIntersecting) e.target.classList.add("vue"); });
  }, { root: flux, threshold: 0.55 });
  document.querySelectorAll(".fin-chapitre").forEach((c) => guetteur.observe(c));
}

/* ---------- panneaux ---------- */

document.querySelectorAll("[data-ferme]").forEach((b) =>
  b.addEventListener("click", () => $(b.dataset.ferme).classList.remove("ouvert")));
$("b-progression").addEventListener("click", () => { rendreProgression(); $("p-progression").classList.add("ouvert"); });
$("progression-corps").addEventListener("click", (e) => {
  const titre = e.target.dataset?.oter;
  if (!titre) return;
  etat.aLire = listeLecture().filter((o) => o.titre !== titre);
  sauver();
  rendreProgression();
  peindreEntete(indexCourant());
});
$("b-reglages").addEventListener("click", () => { rendreReglages(); $("p-reglages").classList.add("ouvert"); });

function anneau(valeur, libelle, couleur, pct) {
  const offset = 170 - (170 * Math.min(100, pct)) / 100;
  return `<div class="anneau"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="5"></circle>
    <circle cx="32" cy="32" r="27" fill="none" stroke="${couleur}" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="170" stroke-dashoffset="${offset}" transform="rotate(-90 32 32)"></circle>
    <text x="32" y="37" text-anchor="middle" class="anneau-val">${valeur}</text></svg>
    <div class="anneau-lib">${libelle}</div></div>`;
}

function rendreProgression() {
  // La progression vit dans le stockage du navigateur, pas dans le paquet. La
  // montrer noir sur blanc evite d avoir a deviner, un jour, si une mise a jour
  // l a effacee ou si rien n avait ete enregistre.
  const lues = etat.evenements.filter((e) => e.action === "terminee").length;
  const dates = etat.evenements.map((e) => e.date).filter(Boolean);
  const dernier = dates.length
    ? new Date(Math.max(...dates)).toLocaleString("fr-FR",
        { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
    : "aucun";

  const ret = M.retention(etat);
  const serie = M.serie(etat);
  const modules = M.progression(paquet, etat);
  const actifs = modules.filter((m) => m.statut === "actif");
  const moyenne = actifs.length ? Math.round(actifs.reduce((s, m) => s + m.pct, 0) / actifs.length) : 0;

  $("progression-corps").innerHTML = `
    <div class="anneaux">
      ${anneau(ret === null ? "—" : ret + "%", "rappels<br>réussis 7j", "#e0a458", ret ?? 0)}
      ${anneau(serie, "jours<br>d'affilée", "#8fb996", Math.min(100, serie * 14))}
      ${anneau(moyenne + "%", "parcours<br>actifs", "#7fa6c4", moyenne)}
    </div>
    <div class="sous-titre">Enregistrement</div>
    <div class="ligne"><span class="nom-mod">Cartes lues, en mémoire</span>
      <span class="val">${lues}</span></div>
    <div class="ligne"><span class="nom-mod">Dernier geste enregistré</span>
      <span class="val">${dernier}</span></div>
    ${listeLecture().length ? `<div class="sous-titre">Ma liste de lecture</div>
      <div class="liste-lire">${listeLecture().slice().reverse().map((o) => `
        <div class="ligne">
          <span class="nom-mod" style="flex-direction:column;align-items:flex-start;gap:0">
            <span class="lire-titre">${echappe(o.titre)}</span>
            <span class="lire-auteur">${echappe(o.auteur || "")}</span>
            <span class="lire-liens">${o.gutenberg
              ? `<a href="${o.gutenberg}" target="_blank" rel="noopener">lire en ligne</a>` : ""}${
                o.source ? `<a href="${o.source}" target="_blank" rel="noopener">la fiche</a>` : ""}</span>
          </span>
          <button class="oter" type="button" data-oter="${echappe(o.titre)}"
                  aria-label="Retirer">&times;</button>
        </div>`).join("")}</div>` : ""}
    <div class="sous-titre">Modules actifs</div>
    ${actifs.map((m) => `<div class="ligne">
      <span class="nom-mod"><i class="puce" style="background:${couleurs(m.id)[0]}"></i>${echappe(m.nom)}</span>
      <span class="val">${m.faits}/${m.total} · ${m.etat}</span></div>`).join("")
      || '<div class="ligne"><span class="val">aucun</span></div>'}
    <div class="sous-titre">En réserve</div>
    ${modules.filter((m) => m.statut !== "actif").map((m) => `<div class="ligne">
      <span class="nom-mod"><i class="puce" style="background:${couleurs(m.id)[0]}"></i>${echappe(m.nom)}</span>
      <span class="val">${m.total} carte${m.total > 1 ? "s" : ""}</span></div>`).join("")
      || '<div class="ligne"><span class="val">aucun</span></div>'}`;
}

function rendreReglages() {
  const objectif = etat.objectif || paquet.reglages?.objectif_cartes_jour || 12;
  const actifs = new Set(M.modulesActifs(paquet, etat).map((m) => m.id));

  $("reglages-corps").innerHTML = `
    <div class="sous-titre">Objectif du jour</div>
    <div class="ligne"><span>${objectif} cartes</span><span class="val" id="v-objectif">${objectif}</span></div>
    <input type="range" id="r-objectif" min="5" max="40" step="1" value="${objectif}">

    <div class="sous-titre">Modules servis dans le flux</div>
    ${paquet.modules.map((m) => `<div class="ligne">
      <span class="nom-mod"><i class="puce" style="background:${couleurs(m.id)[0]}"></i>${echappe(m.nom)}</span>
      <button class="bascule${actifs.has(m.id) ? " on" : ""}" data-module="${m.id}" aria-label="Activer"><i></i></button>
    </div>`).join("")}

    <div class="sous-titre">Données</div>
    <div class="ligne"><span>Progression enregistrée sur cet appareil</span></div>
    <div class="boutons">
      <button class="pilule" type="button" id="b-export">Exporter</button>
      <button class="pilule" type="button" id="b-raz">Tout effacer</button>
    </div>
    <div class="meta-bas">contenu généré le ${(paquet.genere_le || "").slice(0, 10)} · ${paquet.cartes.length} cartes</div>`;

  $("r-objectif").addEventListener("input", (e) => {
    etat.objectif = Number(e.target.value);
    $("v-objectif").textContent = etat.objectif;
    M.sauverEtat(etat);
  });
  $("reglages-corps").querySelectorAll("[data-module]").forEach((b) =>
    b.addEventListener("click", () => {
      const id = b.dataset.module;
      const liste = new Set(M.modulesActifs(paquet, etat).map((m) => m.id));
      liste.has(id) ? liste.delete(id) : liste.add(id);
      etat.modulesActifs = [...liste];
      // On note aussi les modules que ce reglage a vus : ceux qui arriveront
      // plus tard dans le paquet suivront leur propre statut au lieu d etre
      // exclus par une liste qui ne les connaissait pas.
      etat.modulesVus = paquet.modules.map((m) => m.id);
      if (!etat.activation[id]) etat.activation[id] = Date.now();
      M.sauverEtat(etat);
      b.classList.toggle("on");
      batirFlux(); calculerTeintes(); peindre();
    }));
  $("b-export").addEventListener("click", () => {
    navigator.clipboard?.writeText(JSON.stringify(etat));
    annoncer("progression copiée");
  });
  $("b-raz").addEventListener("click", () => {
    if (!confirm("Effacer toute ta progression ?")) return;
    etat = M.etatVide();
    M.sauverEtat(etat);
    batirFlux(); calculerTeintes(); peindre();
    $("p-reglages").classList.remove("ouvert");
  });
}

function ouvrirFin() {
  const session = M.sessionDuJour(etat, etat.objectif || 12);
  const ret = M.retention(etat);
  annoncer(`objectif atteint · ${session.vues} cartes`);
  rendreProgression();
  $("progression-corps").insertAdjacentHTML("afterbegin",
    `<div class="bloc" style="margin-bottom:22px">
      <div class="cl-titre" style="opacity:1">C'est fait pour aujourd'hui.</div>
      <div class="cl-sous" style="opacity:1">${session.vues} cartes${ret !== null ? ` · ${ret} % de rappels réussis` : ""}</div>
      <div class="boutons"><button class="pilule plein" type="button" id="b-bonus">Continuer en bonus</button></div>
    </div>`);
  $("p-progression").classList.add("ouvert");
  $("b-bonus")?.addEventListener("click", () => {
    mode = "bonus"; debutBonus = Date.now();
    $("p-progression").classList.remove("ouvert");
    batirFlux(); calculerTeintes(); peindre();
    annoncer("mode bonus · léger et plaisant");
  });
}

/* ---------- demarrage ---------- */

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

(async () => {
  try {
    // Les deux en parallele : le paquet vient du reseau ou du cache, les
    // polices du navigateur. Rien ne sert de les enchainer.
    [paquet] = await Promise.all([charger(), policesPretes()]);
  } catch (erreur) {
    $("attente").textContent = "Contenu introuvable. Place contenu.json à côté de cette page.";
    return;
  }
  // En demonstration, on antidate l activation d une semaine : sans dette, le
  // moteur n a aucune raison de faire remonter un chapitre plutot qu une carte
  // courte, et on ne verrait pas ce qu il sait faire.
  const debut = Date.now() - (paquet.demo ? 7 * 86400000 : 0);
  for (const m of paquet.modules) {
    if (m.statut === "actif" && !etat.activation[m.id]) etat.activation[m.id] = debut;
  }
  M.sessionDuJour(etat, etat.objectif || paquet.reglages?.objectif_cartes_jour || 12);
  M.sauverEtat(etat);
  batirFlux();
  calculerTeintes();
  peindre();

  // Filet : si une police arrive apres le delai de garde, on remesure.
  document.fonts?.ready?.then(() => verifierDebordement(0));
  // Une rotation change toute la geometrie : on redecoupe, sans perdre la place.
  let rotation = null;
  window.addEventListener("resize", () => {
    clearTimeout(rotation);
    rotation = setTimeout(() => { recalagesRestants = 2; reconstruire(); }, 250);
  });
})();
</script>
